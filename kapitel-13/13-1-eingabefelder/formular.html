<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Formulare ausprobieren</title>
  <style>
    label {
      display: block;
      margin-top: 12px;
    }
  </style>
  <script src="formular.js" defer></script>
</head>
<body>
  <h1>Formulare ausprobieren</h1>
  <form id="formular">
    <label for="vorname">Vorname</label>
    <input type="text" id="vorname" name="vorname">

    <label for="alter">Alter</label>
    <input type="number" id="alter" name="alter">

    <label for="nachricht">Nachricht</label>
    <textarea id="nachricht" name="nachricht"></textarea>

    <p><button type="submit">Absenden</button></p>
  </form>
  <p id="ausgabe"></p>
</body>
</html>
