<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Trinkgeldrechner</title>
  <style>
    label {
      display: block;
      margin-top: 12px;
    }
  </style>
  <script src="trinkgeld.js" defer></script>
</head>
<body>
  <h1>Trinkgeldrechner</h1>
  <form id="rechner" novalidate>
    <label for="betrag">Rechnungsbetrag in €</label>
    <input type="number" id="betrag" step="0.01">

    <label for="satz">Trinkgeld</label>
    <select id="satz">
      <option value="5">5 %</option>
      <option value="10" selected>10 %</option>
      <option value="15">15 %</option>
    </select>

    <label for="personen">Personen</label>
    <input type="number" id="personen" value="1">

    <p><button type="submit">Berechnen</button></p>
  </form>
  <p id="ergebnis"></p>
</body>
</html>
