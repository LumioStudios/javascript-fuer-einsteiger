<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Passwort-Ampel</title>

    #regeln li {
      color: gray;
    }

    #regeln li.erfuellt {
      color: green;
    }
  </style>
  <script src="ampel.js" defer></script>

  <p id="staerke"></p>

</html>
